<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; media-src 'self' file:; style-src 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./pet.css" />
    <title>蓝小妹</title>
  </head>
  <body>
    <main class="pet-stage">
      <section id="bubble" class="bubble" aria-live="polite" hidden>
        <span id="greeting"></span>
        <img id="sticker" class="sticker-display" alt="" hidden />
        <button id="bubble-chat" type="button" title="互动与语音" aria-label="互动与语音">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-5 3v-3H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2Z" /></svg>
        </button>
      </section>
      <button id="pet" class="pet" type="button" aria-label="拖动蓝小妹，点击和她打招呼">
        <img src="../assets/portraits/portrait-desktop.png" alt="蓝小妹" draggable="false" />
      </button>
      <span id="sleep" class="sleep" hidden aria-label="休息中">z z Z</span>
      <nav class="pet-tools" aria-label="蓝小妹桌宠操作">
        <button id="open-chat" type="button" title="AI 聊天 · 功能暂未开放" aria-label="AI 聊天 · 功能暂未开放"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-5 3v-3H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2Z"/><path d="M8 10h8M8 13.5h5"/></svg></button>
        <button id="open-settings" type="button" title="互动与语音" aria-label="互动与语音"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.3a3.7 3.7 0 1 0 0 7.4 3.7 3.7 0 0 0 0-7.4Z"/><path d="m19.4 13.5 1.1.9-1.2 2.1-1.4-.5a7.7 7.7 0 0 1-1.4.8l-.3 1.5h-2.4l-.4-1.5a7.7 7.7 0 0 1-1.5-.1l-1 1.1-2.1-1.2.5-1.4a7.7 7.7 0 0 1-.8-1.4l-1.5-.3v-2.4l1.5-.4a7.7 7.7 0 0 1 .1-1.5l-1.1-1 1.2-2.1 1.4.5a7.7 7.7 0 0 1 1.4-.8l.3-1.5h2.4l.4 1.5a7.7 7.7 0 0 1 1.5.1l1-1.1 2.1 1.2-.5 1.4a7.7 7.7 0 0 1 .8 1.4l1.5.3v2.4l-1.5.4a7.7 7.7 0 0 1-.1 1.5Z"/></svg></button>
        <button id="quit" type="button" title="退出桌宠" aria-label="退出桌宠"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H10M14 16l4-4-4-4M18 12H9"/></svg></button>
      </nav>
    </main>
    <script type="module" src="./pet.js"></script>
  </body>
</html>
